# Your feedback relay. Deploy with `npm run deploy`; the GitHub token is a
# secret (`npx wrangler secret put GITHUB_TOKEN`), never a var.
name = "feedback-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# For node:buffer, whose native base64 encodes the images for GitHub.
compatibility_flags = ["nodejs_compat"]

# Five reports a minute from one address: plenty for a person, and it slows
# anyone who found the relay's URL in an app's source and wants to flood a repo.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
